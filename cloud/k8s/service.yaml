apiVersion: v1
kind: Service
metadata:
  name: sda-pathfinder
  labels:
    app: sda-pathfinder
spec:
  type: ClusterIP
  selector:
    app: sda-pathfinder
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sda-pathfinder
  annotations:
    # Session affinity is a CORRECTNESS requirement here, not an optimisation:
    # sessions live in one pod's memory, so a request routed elsewhere 404s.
    haproxy.router.openshift.io/balance: leastconn
    haproxy.router.openshift.io/disable_cookies: "false"
    router.openshift.io/cookie_name: sdapf_route
    # CRITICAL: the router's default 30s server timeout would sever every SSE
    # stream. Collection runs are long; give the stream hours.
    haproxy.router.openshift.io/timeout: 4h
spec:
  to:
    kind: Service
    name: sda-pathfinder
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
